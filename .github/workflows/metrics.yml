# Generates the profile card embedded in README.md.
# Docs: https://github.com/lowlighter/metrics#-documentation
#
# The card is rendered here and committed into this repo as github-metrics.svg,
# so the README never depends on a third-party host staying up.
name: Metrics

on:
  # Once a day is plenty - the card only changes as fast as the stats do.
  schedule: [{cron: "17 6 * * *"}]
  workflow_dispatch:
  push: {branches: [main, feat/live-metrics-card]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          # METRICS_TOKEN is a personal access token; see METRICS.md.
          # Without it this falls back to the built-in token, which renders the
          # base card but cannot read private-repo or user-level stats.
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          committer_token: ${{ github.token }}

          user: Da-Hauge
          template: classic
          filename: github-metrics.svg
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          config_timezone: Europe/Berlin

          plugin_introduction: yes
          plugin_introduction_title: yes

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_other: yes
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          plugin_lines: yes
          plugin_lines_sections: base

          plugin_habits: yes
          plugin_habits_charts_type: classic
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_from: 200

          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
